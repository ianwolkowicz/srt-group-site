<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="gear1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4dbe4"/>
      <stop offset="100%" style="stop-color:#939faf"/>
    </linearGradient>
    <linearGradient id="gear2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#bcc5d1"/>
      <stop offset="100%" style="stop-color:#7d8a9a"/>
    </linearGradient>
  </defs>

  <!-- Large Gear (main, bottom-right of cluster) -->
  <g transform="translate(52, 62)">
    <!-- Gear teeth -->
    <path d="
      M0,-30 L3.5,-26 L7,-30 L9,-24 L14,-26 L13,-20 L18.5,-18 L15.5,-13 L20,-9 L16,-5.5 L19,-1 L15,1.5 L17,6.5 L12.5,7 L13,12.5 L9,10.5 L8,15.5 L4,12.5 L2,17 L-2,13.5 L-4.5,17 L-7,12.5 L-10,15 L-11,10 L-15,12 L-14,7 L-18.5,7 L-16,2 L-20,-1 L-16.5,-5 L-20,-9.5 L-16,-12 L-18,-17 L-13.5,-17 L-13.5,-22 L-9,-20 L-8,-25 L-4,-22 Z
    " fill="url(#gear1)" stroke="#6b7a8d" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="0" cy="-5" r="12.5" fill="#2a3444" stroke="#6b7a8d" stroke-width="1.5"/>
    <circle cx="0" cy="-5" r="4.5" fill="#6b7a8d"/>
  </g>

  <!-- Medium Gear (top-right, interlocking) -->
  <g transform="translate(80, 32)">
    <path d="
      M0,-21 L2.5,-18 L5,-21 L6.5,-17 L10,-18 L9.5,-14 L13.5,-12.5 L11,-9 L14,-6 L11,-3.5 L13.5,0 L10.5,1 L12,5 L8.5,5 L9,9 L6,7.5 L5.5,11 L3,8.5 L1,12 L-1.5,9.5 L-3.5,12 L-5,8.5 L-7.5,11 L-8,7 L-11,8.5 L-10,4.5 L-13.5,5 L-11.5,1.5 L-14.5,0 L-12,-3 L-14.5,-6.5 L-11.5,-8 L-13,-12 L-9.5,-12 L-10,-16 L-6.5,-14 L-5.5,-18 L-3,-15.5 Z
    " fill="url(#gear2)" stroke="#6b7a8d" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="0" cy="-3.5" r="9" fill="#2a3444" stroke="#6b7a8d" stroke-width="1.2"/>
    <circle cx="0" cy="-3.5" r="3.2" fill="#6b7a8d"/>
  </g>

  <!-- Small Gear (top-left) -->
  <g transform="translate(28, 28)">
    <path d="
      M0,-15 L2,-13 L3.5,-15 L5,-12 L7,-13 L7,-10 L10,-9 L8,-7 L10,-4.5 L8,-3 L9.5,0 L7,0.5 L8,3.5 L5.5,3 L5.5,6 L3,4.5 L1.5,7 L-0.5,5 L-2.5,7 L-4,4.5 L-6,6 L-6,3 L-9,3.5 L-7.5,0.5 L-10,0 L-8,-3 L-10.5,-5 L-8,-7 L-10,-9.5 L-7,-9.5 L-7,-13 L-4.5,-11.5 L-4,-14.5 L-2,-12.5 Z
    " fill="url(#gear1)" stroke="#6b7a8d" stroke-width="0.8" stroke-linejoin="round"/>
    <circle cx="0" cy="-3" r="6" fill="#2a3444" stroke="#6b7a8d" stroke-width="1"/>
    <circle cx="0" cy="-3" r="2" fill="#6b7a8d"/>
  </g>

  <!-- Wrench (angled across gears) -->
  <g transform="translate(60, 80) rotate(-45)">
    <!-- Handle -->
    <rect x="-2.8" y="-28" width="5.6" height="36" rx="2" fill="url(#gear2)" stroke="#6b7a8d" stroke-width="0.8"/>
    <!-- Open jaw (top) -->
    <path d="M-7,-28 C-7,-35 -1,-37 0,-37 C1,-37 7,-35 7,-28 L5,-24 L-5,-24 Z" fill="url(#gear1)" stroke="#6b7a8d" stroke-width="0.8"/>
    <rect x="-1" y="-37" width="2" height="6" fill="#2a3444"/>
    <!-- Closed jaw (bottom) -->
    <path d="M-5,8 C-6,11 -5,14 0,14 C5,14 6,11 5,8 L4,5 L-4,5 Z" fill="url(#gear1)" stroke="#6b7a8d" stroke-width="0.8"/>
  </g>

  <!-- SRT Group Text -->
  <text x="125" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="2">SRT Group<tspan font-size="20" font-weight="400" fill="#8a95a5">,</tspan></text>
  <text x="398" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#8a95a5" letter-spacing="1"> Inc.</text>

  <!-- Accent line -->
  <rect x="125" y="62" width="60" height="3" rx="1.5" fill="#e8871e"/>

  <!-- Tagline -->
  <text x="125" y="85" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-style="italic" fill="#7d8a9a" letter-spacing="0.8">Industrial Demolition &amp; Equipment Recovery</text>
</svg>
